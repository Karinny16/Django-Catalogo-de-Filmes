{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animes Cadastrados</title>
    <link rel="stylesheet" href="{% static 'animes/style.css' %}">
</head>
<body>
  <h1> Lista de Filmes</h1> 
  <div class="lista-animes">
    {% for anime in animes %}
    <div class="anime">
        <img src={{anime.capa}}>
        <p> {{anime.titulo}} ({{ anime.ano}})  </p>
    </div>
{% endfor %}
  </div> 
</body>
</html>
